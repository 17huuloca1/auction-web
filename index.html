<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đấu Giá Trực Tuyến — Online Auction</title>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand" data-route="home">
      <span class="logo">🏷️</span>
      <span class="brand-name">AuctionVN</span>
    </div>

    <nav class="nav">
      <a href="#" data-route="home" class="nav-link">Trang chủ</a>
      <a href="#" data-route="seller" class="nav-link" data-require-role="seller">Quản lý sản phẩm</a>
      <a href="#" data-route="admin" class="nav-link" data-require-role="admin">Quản trị</a>
      <a href="#" data-route="profile" class="nav-link" data-require-auth="true">Hồ sơ</a>
    </nav>

    <div class="topbar-right">
      <div class="user-info" id="userInfo" hidden>
        <span class="role-badge" id="userRoleBadge"></span>
        <span id="userName"></span>
        <button class="btn-ghost" id="logoutBtn">Đăng xuất</button>
      </div>
      <div class="auth-actions" id="authActions">
        <button class="btn-ghost" id="loginBtn">Đăng nhập</button>
        <button class="btn-primary" id="registerBtn">Đăng ký</button>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <!-- AUTH MODAL -->
  <div class="modal" id="authModal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="authTitle">Đăng nhập</h3>
        <button class="modal-close" data-close-modal="authModal">×</button>
      </div>
      <div class="modal-body">
        <div class="tabs">
          <button class="tab active" data-tab="login">Đăng nhập</button>
          <button class="tab" data-tab="register">Đăng ký</button>
        </div>
        <form id="loginForm" class="auth-form">
          <label>Tên đăng nhập <input name="username" required /></label>
          <label>Mật khẩu <input name="password" type="password" required /></label>
          <button class="btn-primary block" type="submit">Đăng nhập</button>
          <p class="hint">Tài khoản mẫu: <code>admin/admin</code>, <code>seller/seller</code>, <code>bidder/bidder</code></p>
        </form>
        <form id="registerForm" class="auth-form" hidden>
          <label>Họ tên <input name="fullname" required /></label>
          <label>Tên đăng nhập <input name="username" required /></label>
          <label>Mật khẩu <input name="password" type="password" required /></label>
          <label>Vai trò
            <select name="role" required>
              <option value="bidder">Người đấu giá (Bidder)</option>
              <option value="seller">Người bán (Seller)</option>
            </select>
          </label>
          <button class="btn-primary block" type="submit">Tạo tài khoản</button>
        </form>
      </div>
    </div>
  </div>

  <!-- BID MODAL -->
  <div class="modal" id="bidModal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3>Đặt giá đấu</h3>
        <button class="modal-close" data-close-modal="bidModal">×</button>
      </div>
      <div class="modal-body">
        <form id="bidForm" class="bid-form">
          <p>Giá hiện tại: <strong id="bidModalCurrent"></strong></p>
          <p>Bước giá tối thiểu: <strong id="bidModalMin"></strong></p>
          <label>Số tiền bạn muốn đấu (VND)
            <input name="amount" type="number" min="0" required />
          </label>
          <button class="btn-primary block" type="submit">Xác nhận đặt giá</button>
        </form>
      </div>
    </div>
  </div>

  <!-- AUTO-BID MODAL -->
  <div class="modal" id="autoBidModal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3>Cấu hình Auto-Bidding</h3>
        <button class="modal-close" data-close-modal="autoBidModal">×</button>
      </div>
      <div class="modal-body">
        <form id="autoBidForm" class="bid-form">
          <p class="hint">Hệ thống sẽ tự động đấu thay bạn, không vượt quá ngưỡng tối đa.</p>
          <label>Mức giá tối đa (maxBid)
            <input name="maxBid" type="number" min="0" required />
          </label>
          <label>Bước giá nhảy (increment)
            <input name="increment" type="number" min="1000" required />
          </label>
          <button class="btn-primary block" type="submit">Bật Auto-Bid</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ITEM FORM MODAL -->
  <div class="modal" id="itemModal" hidden>
    <div class="modal-card big">
      <div class="modal-head">
        <h3 id="itemModalTitle">Thêm sản phẩm đấu giá</h3>
        <button class="modal-close" data-close-modal="itemModal">×</button>
      </div>
      <div class="modal-body">
        <form id="itemForm" class="item-form">
          <input type="hidden" name="id" />
          <div class="grid-2">
            <label>Tên sản phẩm <input name="name" required /></label>
            <label>Loại sản phẩm
              <select name="category" required>
                <option value="Electronics">Đồ điện tử</option>
                <option value="Art">Nghệ thuật</option>
                <option value="Vehicle">Phương tiện</option>
                <option value="Other">Khác</option>
              </select>
            </label>
          </div>
          <label>Mô tả <textarea name="description" rows="3" required></textarea></label>
          <label>URL hình ảnh (placeholder, có thể đổi sau)
            <input name="imageUrl" placeholder="https://..." />
          </label>
          <div class="grid-3">
            <label>Giá khởi điểm (VND)
              <input name="startingPrice" type="number" min="0" required />
            </label>
            <label>Bước giá tối thiểu
              <input name="minIncrement" type="number" min="1000" value="50000" required />
            </label>
            <label>Bước giá hiện tại (auto)
              <input name="currentBid" type="number" min="0" disabled />
            </label>
          </div>
          <div class="grid-2">
            <label>Thời gian bắt đầu
              <input name="startTime" type="datetime-local" required />
            </label>
            <label>Thời gian kết thúc
              <input name="endTime" type="datetime-local" required />
            </label>
          </div>
          <button class="btn-primary block" type="submit">Lưu sản phẩm</button>
        </form>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
